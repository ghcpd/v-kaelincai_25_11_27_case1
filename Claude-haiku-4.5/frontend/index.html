<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Booking System v2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9em;
            margin: 10px 0;
        }
        
        .status-init { background: #e3e8ef; color: #333; }
        .status-in-progress { background: #ffd700; color: #333; }
        .status-success { background: #4caf50; color: white; }
        .status-failure { background: #f44336; color: white; }
        .status-partial { background: #ff9800; color: white; }
        .status-compensating { background: #ff9800; color: white; }
        
        .result {
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        .result.error {
            border-left-color: #f44336;
            background: #ffebee;
        }
        
        .result.success {
            border-left-color: #4caf50;
            background: #e8f5e9;
        }
        
        .result h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .result-field {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }
        
        .result-field:last-child {
            border-bottom: none;
        }
        
        .result-field strong {
            color: #555;
        }
        
        .result-field span {
            color: #999;
            word-break: break-all;
        }
        
        .timeline {
            margin-top: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 5px;
        }
        
        .timeline h3 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .timeline-item {
            display: flex;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #ddd;
        }
        
        .timeline-item:last-child {
            border-bottom: none;
        }
        
        .timeline-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #667eea;
            margin-right: 15px;
            margin-top: 5px;
            flex-shrink: 0;
        }
        
        .timeline-content {
            flex: 1;
        }
        
        .timeline-content strong {
            color: #333;
        }
        
        .timeline-content p {
            color: #999;
            font-size: 0.9em;
            margin-top: 5px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .stat {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
        }
        
        .stat-label {
            color: #555;
            font-size: 0.9em;
            margin-top: 5px;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        .loading {
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .admin-section {
            background: #fff3e0;
            border: 2px dashed #ff9800;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
        }
        
        .admin-section h4 {
            color: #ff6f00;
            margin-bottom: 15px;
        }
        
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 Appointment Booking System v2</h1>
            <p>Reliable Booking with Idempotency, Compensation & Audit Trail</p>
        </div>
        
        <div class="main-grid">
            <!-- Booking Form -->
            <div class="card">
                <h2>📅 New Appointment</h2>
                <form id="bookingForm">
                    <div class="form-group">
                        <label for="userId">User ID *</label>
                        <input type="text" id="userId" placeholder="e.g., user_001" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="patientName">Patient Name *</label>
                        <input type="text" id="patientName" placeholder="e.g., John Doe" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="appointmentDate">Date *</label>
                        <input type="date" id="appointmentDate" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="appointmentTime">Time *</label>
                        <input type="time" id="appointmentTime" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="requestId">Request ID (Idempotency Key) *</label>
                        <input type="text" id="requestId" placeholder="e.g., req_abc123" required>
                        <small style="color: #999; margin-top: 5px; display: block;">
                            Use same ID to test duplicate handling
                        </small>
                    </div>
                    
                    <button type="submit">Book Appointment</button>
                    <button type="button" onclick="generateRequestId()" style="background: #9e9e9e; margin-top: 10px;">
                        Generate New Request ID
                    </button>
                </form>
                
                <div id="result" class="result">
                    <h3 id="resultTitle">Result</h3>
                    <div id="resultContent"></div>
                </div>
                
                <div class="admin-section">
                    <h4>⚙️ Mock Calendar Configuration</h4>
                    <div class="admin-grid">
                        <div class="form-group">
                            <label for="mockErrorMode">Error Mode</label>
                            <select id="mockErrorMode" onchange="updateMockConfig()">
                                <option value="success">Success</option>
                                <option value="timeout">Timeout (6s)</option>
                                <option value="invalid_response">Invalid Response (500)</option>
                                <option value="server_error">Server Error (503)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="mockTimeout">Timeout (ms)</label>
                            <input type="number" id="mockTimeout" value="3000" min="100" max="10000" onchange="updateMockConfig()">
                        </div>
                    </div>
                    <button onclick="resetAll()" style="background: #f44336; margin-top: 15px;">
                        Reset All Data
                    </button>
                </div>
            </div>
            
            <!-- Status & Statistics -->
            <div class="card">
                <h2>📊 System Status</h2>
                <div id="statsContainer"></div>
                
                <div class="timeline">
                    <h3>📝 Event Timeline</h3>
                    <div id="timeline"></div>
                </div>
            </div>
        </div>
        
        <!-- Full Width Recent Events -->
        <div class="card full-width">
            <h2>📋 Recent Audit Events</h2>
            <div id="auditEvents"></div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:5000/api';
        let bookingTimeline = [];
        let lastAuditEvents = [];
        
        // Set minimum date to today
        document.getElementById('appointmentDate').min = new Date().toISOString().split('T')[0];
        
        // Generate random request ID
        function generateRequestId() {
            const id = 'req_' + Math.random().toString(36).substring(2, 10);
            document.getElementById('requestId').value = id;
        }
        
        // Initialize with random request ID
        generateRequestId();
        
        // Book appointment
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const button = e.target.querySelector('button[type="submit"]');
            button.disabled = true;
            button.innerHTML = '<span class="loading">⏳</span> Booking...';
            
            const data = {
                user_id: document.getElementById('userId').value,
                patient_name: document.getElementById('patientName').value,
                appointment_date: document.getElementById('appointmentDate').value,
                appointment_time: document.getElementById('appointmentTime').value,
                request_id: document.getElementById('requestId').value
            };
            
            bookingTimeline = [];
            
            try {
                const response = await fetch(`${API_BASE}/appointments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                displayResult(response.status, result, data);
                await loadStats();
                await loadAuditEvents();
            } catch (error) {
                displayError(error.message);
            } finally {
                button.disabled = false;
                button.innerHTML = 'Book Appointment';
            }
        });
        
        function displayResult(statusCode, data, request) {
            const resultDiv = document.getElementById('result');
            const resultTitle = document.getElementById('resultTitle');
            const resultContent = document.getElementById('resultContent');
            
            const isSuccess = statusCode >= 200 && statusCode < 300;
            
            let html = `
                <div class="result-field">
                    <strong>HTTP Status:</strong>
                    <span>${statusCode}</span>
                </div>
                <div class="result-field">
                    <strong>Status:</strong>
                    <span><span class="status-badge status-${data.status?.toLowerCase()}">${data.status || 'UNKNOWN'}</span></span>
                </div>
            `;
            
            if (data.appointment_id) {
                html += `
                    <div class="result-field">
                        <strong>Appointment ID:</strong>
                        <span>${data.appointment_id}</span>
                    </div>
                `;
            }
            
            if (data.calendar_slot_id) {
                html += `
                    <div class="result-field">
                        <strong>Calendar Slot:</strong>
                        <span>${data.calendar_slot_id}</span>
                    </div>
                `;
            }
            
            if (data.error_code) {
                html += `
                    <div class="result-field">
                        <strong>Error Code:</strong>
                        <span>${data.error_code}</span>
                    </div>
                    <div class="result-field">
                        <strong>Error Message:</strong>
                        <span>${data.error_message || 'N/A'}</span>
                    </div>
                `;
            }
            
            if (data.is_idempotency_hit) {
                html += `
                    <div class="result-field" style="background: #e3f2fd; padding: 10px; border-radius: 3px;">
                        <strong>💾 Idempotency Hit:</strong>
                        <span>Duplicate request - returned cached response</span>
                    </div>
                `;
            }
            
            html += `
                <div class="result-field">
                    <strong>Created At:</strong>
                    <span>${new Date(data.created_at).toLocaleString()}</span>
                </div>
            `;
            
            resultTitle.innerHTML = isSuccess ? '✓ Booking Successful' : '✗ Booking Failed';
            resultContent.innerHTML = html;
            resultDiv.classList.add('show');
            resultDiv.classList.toggle('error', !isSuccess);
            resultDiv.classList.toggle('success', isSuccess);
        }
        
        function displayError(message) {
            const resultDiv = document.getElementById('result');
            document.getElementById('resultTitle').innerHTML = '✗ Error';
            document.getElementById('resultContent').innerHTML = `
                <div class="result-field">
                    <strong>Error:</strong>
                    <span>${message}</span>
                </div>
            `;
            resultDiv.classList.add('show');
            resultDiv.classList.add('error');
        }
        
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`);
                const stats = await response.json();
                
                let html = `
                    <div class="stats-grid">
                        <div class="stat">
                            <div class="stat-value">${stats.database.total_appointments}</div>
                            <div class="stat-label">Total Appointments</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${stats.database.by_status.SUCCESS || 0}</div>
                            <div class="stat-label">Successful</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${stats.database.by_status.FAILURE || 0}</div>
                            <div class="stat-label">Failed</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${stats.idempotency_store.cached_requests}</div>
                            <div class="stat-label">Cached Requests</div>
                        </div>
                    </div>
                `;
                
                document.getElementById('statsContainer').innerHTML = html;
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }
        
        async function loadAuditEvents() {
            try {
                const response = await fetch(`/logs/appointment_audit.log`);
                if (response.ok) {
                    const text = await response.text();
                    const events = text.split('\n').filter(line => line.trim()).map(line => {
                        try {
                            return JSON.parse(line);
                        } catch {
                            return null;
                        }
                    }).filter(Boolean).slice(-10).reverse();
                    
                    lastAuditEvents = events;
                    
                    let html = '';
                    events.forEach(event => {
                        html += `
                            <div style="padding: 10px; border-bottom: 1px solid #ddd; margin-bottom: 10px;">
                                <strong>${event.event_type}</strong>
                                <span style="color: #999; margin-left: 10px;">
                                    ${new Date(event.timestamp).toLocaleTimeString()}
                                </span>
                                <span class="status-badge status-${event.status?.toLowerCase()}" style="float: right;">
                                    ${event.status}
                                </span>
                                <div style="clear: both; font-size: 0.9em; color: #666; margin-top: 5px;">
                                    ${event.appointment_id} | ${event.error_code}
                                </div>
                            </div>
                        `;
                    });
                    
                    document.getElementById('auditEvents').innerHTML = html || '<p style="color: #999;">No events logged yet</p>';
                }
            } catch (error) {
                console.error('Failed to load audit events:', error);
            }
        }
        
        async function updateMockConfig() {
            const errorMode = document.getElementById('mockErrorMode').value;
            const timeout = document.getElementById('mockTimeout').value;
            
            try {
                const response = await fetch(`${API_BASE}/admin/mock-config`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        error_mode: errorMode,
                        timeout_ms: parseInt(timeout)
                    })
                });
                const data = await response.json();
                console.log('Mock config updated:', data);
            } catch (error) {
                console.error('Failed to update mock config:', error);
            }
        }
        
        async function resetAll() {
            if (!confirm('Are you sure you want to reset all data? This cannot be undone.')) {
                return;
            }
            
            try {
                await fetch(`${API_BASE}/admin/reset`, { method: 'POST' });
                alert('All data reset successfully');
                document.getElementById('result').classList.remove('show');
                loadStats();
                loadAuditEvents();
            } catch (error) {
                alert('Failed to reset: ' + error.message);
            }
        }
        
        // Load stats on page load
        loadStats();
        loadAuditEvents();
        
        // Refresh stats every 2 seconds
        setInterval(() => {
            loadStats();
            loadAuditEvents();
        }, 2000);
    </script>
</body>
</html>
