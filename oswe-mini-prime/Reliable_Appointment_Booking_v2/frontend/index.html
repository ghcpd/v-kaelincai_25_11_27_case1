<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Appointment Booking UI</title>
  </head>
  <body>
    <h1>Book Appointment Demo</h1>
    <form id="form">
      <label>Client ID: <input id="client_id" value="client-1" /></label><br/>
      <label>Slot: <input id="slot" value="2025-12-01T10:00:00Z" /></label><br/>
      <label>Idempotency Key: <input id="idem" value="idem-123" /></label><br/>
      <button type="submit">Book</button>
    </form>
    <pre id="result"></pre>
    <script>
      document.getElementById('form').addEventListener('submit', async function (e) {
        e.preventDefault()
        const client_id = document.getElementById('client_id').value
        const slot = document.getElementById('slot').value
        const idempotency = document.getElementById('idem').value
        const resp = await fetch('/api/appointments', {
          method: 'POST',
          headers: {'Content-Type':'application/json', 'Idempotency-Key': idempotency},
          body: JSON.stringify({client_id, slot}),
        })
        const json = await resp.json()
        document.getElementById('result').innerText = JSON.stringify({status: resp.status, body: json}, null, 2)
      })
    </script>
  </body>
</html>
