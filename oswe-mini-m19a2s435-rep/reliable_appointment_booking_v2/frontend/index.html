<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Appointment Booking UI (Mock)</title>
</head>
<body>
  <h1>Appointment Booking (Demo)</h1>
  <form id="bookingForm">
    <label>Client Request ID: <input type="text" id="client_request_id" /></label><br/>
    <label>Slot ID: <input type="text" id="slot_id" /></label><br/>
    <label>Patient Name: <input type="text" id="patient_name" /></label><br/>
    <label>Calendar Mode (none/timeout/error/malformed): <input type="text" id="mode" /></label><br/>
    <button type="submit">Confirm Appointment</button>
  </form>
  <div id="result"></div>

  <script>
    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const client_request_id = document.getElementById('client_request_id').value || ('req_' + Date.now());
      const slot_id = document.getElementById('slot_id').value || 'slot_123';
      const patient_name = document.getElementById('patient_name').value || 'Alice';
      const mode = document.getElementById('mode').value || '';
      const headers = {};
      if (mode) headers['X-Calendar-Mode'] = mode;
      try{
        const resp = await fetch('/appointments/confirm', {
          method: 'POST',
          headers: Object.assign({'Content-Type':'application/json'}, headers),
          body: JSON.stringify({client_request_id, slot_id, patient_name})
        });
        const data = await resp.json();
        document.getElementById('result').innerText = JSON.stringify({status: resp.status, data}, null, 2);
      } catch(e) {
        document.getElementById('result').innerText = 'Error: ' + e.toString();
      }
    });
  </script>
</body>
</html>
